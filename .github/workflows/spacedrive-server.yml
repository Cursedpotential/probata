# Byline: Claude Code · Sonnet 5 · 2026-09-16
#
# Owner order 2026-09-16: the Spacedrive gate on ovh-files runs a frozen
# 2024-08 GHCR image that predates ephemeral (unindexed) filesystem browsing
# and the FileInspector. Those exist on spacedriveapp/spacedrive `main`.
# This workflow builds the SERVER (apps/server, sd-server) plus its embedded
# web client (apps/web) straight from upstream `main` at a pinned commit,
# using upstream's own recipe (apps/server/Dockerfile, documented in that
# file's header comment: `bun install && bun run build` in apps/web/ to
# produce apps/web/dist, which the Dockerfile then COPYs in and builds with
# `--features sd-core/heif,sd-core/ffmpeg`). Pushed to GHCR under this repo's
# owner (Cursedpotential), NOT upstream's own GHCR namespace.
#
# Trigger manually (workflow_dispatch) and pass a different `spacedrive_ref`
# to rebuild against a newer upstream commit later; the default is the
# commit verified live on 2026-09-16 (HEAD of spacedriveapp/spacedrive main).

name: Spacedrive server (build from upstream source)

on:
  workflow_dispatch:
    inputs:
      spacedrive_ref:
        description: "Commit SHA (or ref) in spacedriveapp/spacedrive to build"
        required: false
        default: "6dfeccf2113039e35f2ce735f945e70dc3e4ea45"

permissions:
  contents: read
  packages: write

jobs:
  build-spacedrive-server:
    name: Build sd-server + web client, push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          remove-codeql: 'true'
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-android: 'true'
          overprovision-lvm: 'true'
          remove-docker-images: 'true'
          root-reserve-mb: 2048

      - name: Checkout spacedriveapp/spacedrive @ ${{ github.event.inputs.spacedrive_ref }}
        uses: actions/checkout@v4
        with:
          repository: spacedriveapp/spacedrive
          ref: ${{ github.event.inputs.spacedrive_ref }}
          path: spacedrive-src
          fetch-depth: 1

      - name: Record resolved commit
        id: sd_commit
        working-directory: spacedrive-src
        run: |
          set -euo pipefail
          full_sha="$(git rev-parse HEAD)"
          short_sha="${full_sha:0:7}"
          echo "full_sha=${full_sha}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "Building spacedriveapp/spacedrive @ ${full_sha}"

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - name: Patch packages/ts-client — @tanstack/react-query required, not optional
        working-directory: spacedrive-src
        run: |
          set -euo pipefail
          # Vite's resolve.ts (tryNodeResolve) special-cases an import ONLY
          # when the IMPORTER's nearest package.json lists the bare specifier
          # in both peerDependencies AND peerDependenciesMeta[<name>].optional
          # -- when that's true it returns the synthetic
          # `__vite-optional-peer-dep:<id>:<pkg>` module (empty exports in a
          # production build) INSTEAD of attempting normal resolution, not as
          # a fallback after a failed one. Runs 35091382439/35092105916/
          # 35092935671 all failed identically ("QueryClient is not exported
          # by __vite-optional-peer-dep:@tanstack/react-query:@sd/ts-client")
          # whether install was scoped to apps/web, run from the repo root,
          # or given a `bun add ... --cwd packages/ts-client` afterwards --
          # because none of that removes the optional:true flag that trips
          # this special case in the first place. Fix at the source: drop
          # `optional` from ts-client's peerDependenciesMeta and add it as a
          # real dependency, matching the version packages/interface already
          # uses, before the one-and-only `bun install` below.
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("packages/ts-client/package.json")
          data = json.loads(p.read_text())
          data.setdefault("dependencies", {})["@tanstack/react-query"] = "^5.90.7"
          meta = data.get("peerDependenciesMeta") or {}
          if "@tanstack/react-query" in meta:
              meta["@tanstack/react-query"].pop("optional", None)
              if not meta["@tanstack/react-query"]:
                  del meta["@tanstack/react-query"]
          data["peerDependenciesMeta"] = meta
          p.write_text(json.dumps(data, indent=2) + "\n")
          PY
          grep -A2 '"@tanstack/react-query"' packages/ts-client/package.json

      - name: Install workspace deps (bun install at repo root)
        working-directory: spacedrive-src
        run: |
          set -euo pipefail
          # Installing from the workspace root (not just apps/web/) so bun
          # hoists every packages/* workspace member consistently.
          bun install
          # vite's scss preprocessor (used by packages/interface's
          # QuickPreview one-dark.scss) needs sass-embedded, which no
          # package.json in this workspace declares as of the pinned
          # commit (run 35090921970: "Preprocessor dependency
          # sass-embedded not found").
          bun add -D sass-embedded --cwd apps/web
          ls -la node_modules/@tanstack/react-query 2>&1 || true
          ls -la packages/ts-client/node_modules/@tanstack/react-query 2>&1 || true

      - name: Build apps/web (produces apps/web/dist for the Dockerfile)
        working-directory: spacedrive-src/apps/web
        run: |
          set -euo pipefail
          bun run build
          test -d dist && echo "apps/web/dist built: $(du -sh dist | cut -f1)"

      - name: Patch apps/server/Dockerfile — disambiguate apt cache mount IDs
        working-directory: spacedrive-src
        run: |
          set -euo pipefail
          # Run 35093583222 failed at "apt-get update" in the builder stage:
          # "Could not get lock /var/lib/apt/lists/lock. It is held by
          # process 0". BuildKit runs independent stages (the `builder`
          # stage and the final runtime stage) concurrently when possible;
          # both stages' RUN instructions use
          # `--mount=type=cache,target=/var/lib/apt` (and .../apt/cache)
          # with no explicit `id=`, so BuildKit gives them the SAME cache
          # mount (keyed by target path) and they raced for the real
          # /var/lib/apt/lists/lock file inside it. Upstream's own CI
          # (server.yml) never hits this because it builds with
          # buildah/podman, not `docker buildx build`. Give each stage its
          # own cache id so they no longer share a mount.
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("apps/server/Dockerfile")
          text = p.read_text()
          old = "RUN --mount=type=cache,target=/var/cache/apt --mount=type=cache,target=/var/lib/apt \\"
          builder = "RUN --mount=type=cache,target=/var/cache/apt,id=apt-cache-builder --mount=type=cache,target=/var/lib/apt,id=apt-lib-builder \\"
          runtime = "RUN --mount=type=cache,target=/var/cache/apt,id=apt-cache-runtime --mount=type=cache,target=/var/lib/apt,id=apt-lib-runtime \\"
          assert text.count(old) == 2, f"expected exactly 2 occurrences, found {text.count(old)}"
          text = text.replace(old, builder, 1)
          text = text.replace(old, runtime, 1)
          p.write_text(text)
          PY
          grep -n "id=apt-" apps/server/Dockerfile

          # Run 35094776549 (apt-lock + Cargo.toml fixes both held, reached
          # the actual cargo compile) failed building libheif-sys: "The
          # system library `libheif` required by crate `libheif-sys` was not
          # found... pkg-config --libs --cflags libheif 'libheif >= 1.17'".
          # Debian bookworm (this Dockerfile's base image) ships libheif
          # 1.15.x, below the >=1.17 floor libheif-sys enforces -- and the
          # sibling spacedrive-gate Dockerfile on ovh-files independently
          # verified this exact gap live on 2026-09-14 (that Dockerfile
          # exists specifically to work around it for a prebuilt binary).
          # Debian trixie carries libheif 1.19.8 and ffmpeg 7.1.5 as one
          # consistent set (confirmed live via packages.debian.org
          # 2026-09-16: libavcodec61, libavformat61, libavutil59,
          # libswscale8, libheif1 1.19.8-1+deb13u1). Move both build stages
          # from bookworm-slim to trixie-slim and rename the runtime
          # stage's exact-SONAME package names to match trixie's actual
          # sonames (dev packages need no renaming, Debian doesn't
          # soname-suffix those).
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("apps/server/Dockerfile")
          text = p.read_text()
          assert text.count("FROM debian:bookworm-slim") == 2, text.count("FROM debian:bookworm-slim")
          text = text.replace("FROM debian:bookworm-slim", "FROM debian:trixie-slim")
          old_runtime_libs = "\tlibavcodec59 \\\n\tlibavformat59 \\\n\tlibavutil57 \\\n\tlibswscale6 \\\n\tlibheif1 \\\n"
          new_runtime_libs = "\tlibavcodec61 \\\n\tlibavformat61 \\\n\tlibavutil59 \\\n\tlibswscale8 \\\n\tlibheif1 \\\n"
          assert old_runtime_libs in text, "runtime lib block not found, check Dockerfile formatting"
          text = text.replace(old_runtime_libs, new_runtime_libs)
          p.write_text(text)
          PY
          grep -n "FROM debian\|libavcodec\|libavformat\|libavutil\|libswscale\|libheif" apps/server/Dockerfile

      - name: Patch root Cargo.toml — drop workspace members not in the build context
        working-directory: spacedrive-src
        run: |
          set -euo pipefail
          # Run 35093976607 (apt lock fix held) failed inside the builder
          # stage's `cargo build`: "failed to load manifest for workspace
          # member `/build/apps/mobile/modules/sd-mobile-core/core`... No
          # such file or directory". Cargo eagerly loads the manifest for
          # EVERY entry in [workspace].members when it loads the workspace,
          # even ones excluded by `-p sd-server`. apps/server/Dockerfile
          # only COPYs Cargo.toml/.lock, .cargo, core, crates, apps/server
          # and apps/web/dist -- not apps/mobile, apps/cli or apps/tauri,
          # which the root Cargo.toml still lists as active (uncommented)
          # members. sd-server doesn't depend on those sibling apps, so
          # comment them out of the copy of Cargo.toml used for this image
          # build only (never touches the real repo).
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("Cargo.toml")
          text = p.read_text()
          drop = [
              '"apps/mobile/modules/sd-mobile-core/core"',
              '"apps/cli"',
              '"apps/tauri/sd-tauri-core"',
              '"apps/tauri/src-tauri"',
              '"xtask"',
          ]
          lines = text.splitlines(keepends=True)
          out = []
          hits = {d: 0 for d in drop}
          for line in lines:
              stripped = line.strip()
              matched = None
              for d in drop:
                  if stripped == f'{d},' or stripped == d:
                      matched = d
                      break
              if matched:
                  hits[matched] += 1
                  indent = line[: len(line) - len(line.lstrip("\t"))]
                  out.append(f"{indent}# {stripped}\n")
              else:
                  out.append(line)
          missing = [d for d, n in hits.items() if n == 0]
          assert not missing, f"member entries not found, check formatting: {missing}"
          p.write_text("".join(out))
          PY
          sed -n '1,20p' Cargo.toml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push sd-server image
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: spacedrive-src
          file: spacedrive-src/apps/server/Dockerfile
          push: true
          tags: |
            ghcr.io/cursedpotential/spacedrive-server:main-${{ steps.sd_commit.outputs.short_sha }}
            ghcr.io/cursedpotential/spacedrive-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Spacedrive server image"
            echo ""
            echo "- Upstream commit: \`${{ steps.sd_commit.outputs.full_sha }}\`"
            echo "- Image digest: \`${{ steps.build_push.outputs.digest }}\`"
            echo "- Tags: \`ghcr.io/cursedpotential/spacedrive-server:main-${{ steps.sd_commit.outputs.short_sha }}\`, \`ghcr.io/cursedpotential/spacedrive-server:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
