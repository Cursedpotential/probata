# Byline: Claude Code · Fable 5 · 2026-08-03 (password-policy relax: PASSWORD_POLICY_ENABLED=false + MIN_LENGTH_PRIVILEGED=10 + MAX_AGE_DAYS=36500, so the owner-chosen admin password can be set via /auth/email/change-password)
# Byline: Codex · GPT-5 · 2026-08-16 (held PostgreSQL cutover contract; SQLite preserved for migration/rollback only)
