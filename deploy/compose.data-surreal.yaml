# SurrealDB is RETIRED (ADR-0043 d3, flatten executed 2026-08-04; D-042 OQ-7).
# The container is deliberately PARKED read-only on ovh-data (100.119.96.29),
# NOT Coolify-managed; only the owner deletes it. This file stays at repo root
# as the parked container's record — it was intentionally NOT moved to deploy/
# in the S10 consolidation because no Coolify app references it.
