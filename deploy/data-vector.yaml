# =============================================================================
# Byline: Claude Code · Kimi K3 (drift-fix) · 2026-08-12 — DOWN-deliberate marker added.
# Byline: Claude Code · Fable 5 · 2026-08-12 — REBUILD for memsearch (S3/R2 + fresh etcd,
#          Coolify-only / no-SSH, compose `configs:` for self-contained config).
# Byline: Claude Code · Fable 5 · 2026-08-12 — image pinned to dated 3.0-20260811-7169df25-amd64
#          (up-to-date, explicit amd64). Local MCP (claude-context) hits Milvus DIRECTLY over
#          tailnet — bypasses ContextForge (web facade deferred).
# =============================================================================
# NB 2026-08-12 (Kimi K3): this app was DOWN DELIBERATELY since 2026-08-10 (6th
# embedded-etcd corruption). Milvus sidelined per ADR-0040 (Weaviate locked;
# cutover verified 2026-08-09, D-042). Do NOT deploy/restart without owner sign-off.
#
# ~~SUPERSEDED 2026-08-12 (Fable 5):~~ owner directed a FRESH REBUILD of Milvus
# dedicated to MEMSEARCH ONLY (the Agno platform stays on Weaviate). ovh-data
# (old volume host) is DEAD; the corrupt etcd is gone with it; memsearch
# collections are re-buildable from ~89 journal .md files on the desktop.
# Rebuild shape: Milvus v3 standalone (embedded etcd, FRESH) + Cloudflare R2
# object store (S3-compatible). Deploy target: ovh-files (100.91.190.107).
#
# ARCHITECTURE 2026-08-12 (no-SSH / Coolify-only):
#  - Milvus config (embedEtcd.yaml + user.yaml) is embedded in THIS compose via
#    top-level `configs:` (content below). No host bind-mount of config files ->
#    updating config = edit this file + push + Coolify redeploy. No SSH needed.
#    docker/milvus/{embedEtcd,user}.yaml are kept as the human-readable SOURCE of
#    truth; the `configs:` blocks below MUST mirror them (update both together).
#  - Data volume = /data/probata/volumes/milvus-memsearch (FRESH path). Docker
#    auto-creates it on first up -> starts with clean etcd/WAL, no need to clear
#    the old corrupt /data/probata/volumes/milvus (retired in place, not deleted).
#  - BIND_IP is a Coolify app env var, substituted into the rendered compose at
#    deploy. NOT in git. R2 creds (MINIO_*) remain set as Coolify envs but are
#    UNUSED since 2026-08-23 (storageType=local) — kept only for a fast revert.
# Gated deploy steps (push, Coolify env set, Coolify deploy, re-index) require
# owner sign-off.
# =============================================================================
# DATA TIER — VECTOR SUBSET (Milvus + Attu), split out of compose.data.yaml.
# Reason: 2026-06-25 incident — all 6 DBs were ONE Coolify app, so a Milvus
# crash-loop blew past Coolify max_restart and tore down the WHOLE tier. Isolating
# the flaky vector store into its own Coolify app means a Milvus crash can never
# take the relational/graph/operational DBs down again.
# =============================================================================

services:
  milvus:
    image: milvusdb/milvus:3.0-20260811-7169df25-amd64   # dated 2026-08-11 (newest); explicit amd64 tag — multi-arch manifest segfaults at jemalloc here
    platform: linux/amd64
    container_name: milvus
    # ROOT CAUSE FIX 2026-08-23 (Opus 5): the container could not write its own
    # bind-mounted volume. Docker auto-creates /data/probata/volumes/milvus-memsearch
    # as root:root, but this image runs Milvus as a NON-root user, so boot died at
    #   [FATAL] "failed to mkdir" [localStoragePath=/var/lib/milvus/data]
    #   [error="mkdir /var/lib/milvus/data: permission denied"] -> panic -> rc=134
    # This is why the 2026-08-12 R2 build ALSO crash-looped and never wrote a single
    # object: same wall, hit earlier on ETCD_DATA_DIR=/var/lib/milvus/etcd. S3 was
    # never the cause. Running as root matches upstream's own standalone compose.
    user: "0:0"
    command: ["milvus", "run", "standalone"]
    restart: unless-stopped
    # Embedded etcd needs time to flush its WAL on SIGTERM. Coolify's default
    # stop_grace_period (10s) SIGKILLs milvus before the flush completes ->
    # corrupt WAL -> next start panics "etcdserver: leader changed". Has
    # corrupted the volume on every cutover (2026-06-25, 06-27, 07-05).
    stop_grace_period: 60s
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      # 2026-08-23 (Opus 5): R2/S3 object store BACKED OUT — see user.yaml note (2).
      # The R2 build never reached a healthy boot: bucket milvus-memsearch stayed at
      # 0 objects across every attempt, and Coolify's log endpoint only surfaces the
      # attu container, so the S3 error could not be read out without SSH (barred).
      # Owner call 2026-08-23: drop S3, store locally. NB the 6 prior corruptions were
      # EMBEDDED ETCD, not the object store — local storage does NOT reintroduce that
      # failure class, and it drops an R2 Class-A op on every binlog flush.
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
      # MINIO_* deliberately NOT passed: ignored when storageType=local. The Coolify
      # app envs are left in place so reverting to the S3 build is a one-line change.
      # FIX: image ships LD_PRELOAD=":/milvus/lib/libjemalloc.so" (leading colon → ld.so SIGSEGV). Clean paths:
      LD_PRELOAD: /milvus/lib/libjemalloc.so
      LD_LIBRARY_PATH: /milvus/lib
    volumes:
      # FRESH data volume — embedded etcd + Woodpecker WAL + (since 2026-08-23) the
      # segment/binlog store all live here. Auto-created by Docker on first up. Old
      # /data/probata/volumes/milvus (corrupt etcd from 08-10) is retired in place —
      # NOT mounted, NOT deleted. Back this path up; it is now the only copy.
      - /data/probata/volumes/milvus-memsearch:/var/lib/milvus
    configs:
      # LONG FORM required: short `- <name>` mounts at `/<name>`, but Milvus reads
      # these from /milvus/configs/. Without explicit targets Milvus loads NEITHER
      # config -> etcd defaults to 100ms heartbeat (boot-race panic) + no R2 block.
      - source: embedEtcd_yaml
        target: /milvus/configs/embedEtcd.yaml
      - source: user_yaml
        target: /milvus/configs/user.yaml
    ports:
      - "${BIND_IP:-127.0.0.1}:19530:19530"   # gRPC SDK — tailnet-only (BIND_IP=100.91.190.107 via Coolify env)
      - "${BIND_IP:-127.0.0.1}:9091:9091"     # health
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]   # milvus image HAS curl
      interval: 30s
      start_period: 150s   # bumped from 90s — cold R2 first-boot is slower than local
      timeout: 20s
      retries: 3
    networks:
      - vector
      - probata                # shared external net — cross-app docker DNS on ovh-files

  attu:
    image: zilliz/attu:v3.0.0-beta.6
    platform: linux/amd64
    container_name: attu
    user: "0:0"          # same bind-mount ownership issue as milvus (/data/probata/volumes/attu)
    restart: unless-stopped
    environment:
      MILVUS_ADDRESS: milvus:19530
      ATTU_DB_PATH: /data/attu.db
    volumes:
      - /data/probata/volumes/attu:/data
    ports:
      - "${BIND_IP:-127.0.0.1}:3001:3000"     # Attu UI — tailnet-only
    depends_on:
      milvus:
        condition: service_healthy   # restored 2026-08-23: Milvus now boots clean
    networks:
      - vector
      - probata                # shared external net — so other ovh-files containers can
                            # reach milvus:19530 via docker DNS (cross-app)

# Milvus config, embedded as compose configs (no host bind-mount -> no SSH to edit).
# SOURCE OF TRUTH: docker/milvus/embedEtcd.yaml + docker/milvus/user.yaml — keep
# these `configs:` blocks in sync with those files when you edit either side.
configs:
  embedEtcd_yaml:
    content: |
      # Embedded etcd config — mounted at /milvus/configs/embedEtcd.yaml (ETCD_CONFIG_PATH).
      # Byline: Claude Code · Opus 4.8 · 2026-06-13 (drift-fix 2026-08-12: heartbeat/election)
      listen-client-urls: http://0.0.0.0:2379
      advertise-client-urls: http://0.0.0.0:2379
      quota-backend-bytes: 4294967296
      auto-compaction-mode: revision
      auto-compaction-retention: "1000"
      # Boot-race fix (2026-07-22): single-member embedded etcd on a busy VPS sees
      # 1.5s+ apply latencies at Milvus boot; default 100ms heartbeat / 1000ms
      # election flaps leadership -> Milvus sessionutil panics ("etcdserver: leader
      # changed") -> exit 134 crash loop (observed 3x). One-member cluster = no real
      # elections; these only govern self-leadership stability under I/O stall.
      heartbeat-interval: 1000
      election-timeout: 10000
  user_yaml:
    content: |
      # Milvus config override — mounted at /milvus/configs/user.yaml
      # Byline: Claude Code · Opus 4.8 · 2026-06-13; Opus 5 · 2026-08-05 (Storage V3);
      # Fable 5 · 2026-08-12 (S3/R2 for memsearch rebuild).
      #
      # (1) Auth ON. Default first-boot credential: root/Milvus -> CHANGE on first boot.
      # (2) Object store = LOCAL disk on the fresh volume. ~~Cloudflare R2 via a
      #     minio: block (2026-08-12)~~ BACKED OUT 2026-08-23: that build crash-looped
      #     and never wrote a single object to the bucket. Everything now lives under
      #     /var/lib/milvus on the fresh volume.
      # (3) Storage V3 (useLoonFFI) DISABLED 2026-08-23. It is one-way only on a store
      #     that HAS data; this store is empty (0 objects), so switching it off costs
      #     nothing and removes an exotic code path from an already-failing boot.
      # NOTE: common: must appear EXACTLY ONCE (a second common: drops authorizationEnabled).
      common:
        security:
          authorizationEnabled: true
        storageType: local
      localStorage:
        path: /var/lib/milvus/data
      woodpecker:
        meta:
          type: etcd
          prefix: woodpecker
        storage:
          type: local
          rootPath: /var/lib/milvus/woodpecker

networks:
  vector:
  probata:
    external: true          # pre-created on ovh-files (`docker network create probata`);

# 2026-08-12: rebuilt for memsearch-only — segment store on R2 (no MinIO server; the
# `minio:` config namespace is Milvus's S3-client block, repointed at Cloudflare R2).
# Config embedded via `configs:` (no host bind-mount). Fresh volume milvus-memsearch.
# Byline: Claude Code · Opus 4.8 · 2026-06-25 (split for fault isolation);
#         Claude Code · Fable 5 · 2026-07-05 (Coolify-managed + agno shared net);
#         Claude Code · Fable 5 · 2026-08-12 (memsearch-only rebuild, R2, fresh etcd, no-SSH configs).