# =============================================================================
# OPENCODE-SERVER — headless OpenCode API (`opencode serve`) pulled straight from Docker Hub
# (sprisa/opencode, https://github.com/sprisa/opencode-server, MPL-2.0; owner 2026-09-07 17:24:
# "just pull it from where it's at", no fork). Ubuntu 26.04 + opencode pinned by version, uid 1000
# `opencode` with passwordless sudo, mise lazy tools (node, python3, gh, jq, rg, fd, glab, ruby,
# vim, micro, nano, wget, sapling), tini as PID 1, /home/opencode = THE persistent volume.
# Own Coolify "Docker Compose" app on ovh-files (server cn89l8801u8gsginw1rxq5qt, 100.91.190.107).
#
# Byline: Claude Code · Fable 5.1 · 2026-09-07
# Byline: Claude Code · Fable 5.1 · 2026-09-08 — `opencode web` (server + browser UI at /), owner 12:23 "do the web thing";
#   same password auth. 13:25: inlined entrypoint + Coolify `content:` bind for the tailscale serve config (see notes below).
#
# Coolify env: BIND_IP=100.91.190.107, OPENCODE_SERVER_PASSWORD (never in this file),
#              optional OPENCODE_IMAGE_TAG (pinned default below; bump deliberately, never :latest).
# Coolify Watch Paths: deploy/opencode-server.yaml
# HOST-PREP (once): sudo install -d -o 1000 -g 1000 /data/probata/volumes/opencode/home
# Skills/config mirror: scripts/devbox_mirror_skills.sh --opencode-server → that home
#   (~/.config/opencode, ~/.agents/skills, ~/.claude/skills — all paths OpenCode scans).
# Provider keys are NOT env here: ~/.config/opencode/auth.json (mirrored) or `opencode auth login`
# inside the container; Portkey base URL belongs in opencode.json.
# Consumers: Workbench Ops Copilot (OPENCODE_URL), the `oc` CLI (opencode-ops skill), the devbox.
#
# INGRESS (owner 17:26): Traefik labels are PRE-WIRED for the Authentik-fronted pattern used by the
# Workbench (deploy/workbench.yaml) in case this is later served through Portkey/ContextForge or
# another auth front — but the route is NOT opened: `traefik.enable=false`. Flip that one label to
# `true` (and confirm the Host rule + middleware) to publish; until then it is tailnet-only via BIND_IP.
# =============================================================================

services:
  opencode-server:
    image: sprisa/opencode:${OPENCODE_IMAGE_TAG:-1.18.29}
    container_name: opencode-server
    # `opencode web` = the same headless API as `serve` PLUS the web UI at / (basic auth applies to both).
    # The image's own entrypoint hard-codes `serve`. CORRECTION 2026-09-08 13:25: the first attempt bind-mounted a
    # repo script, but Coolify does NOT check the repo out next to the rendered compose — relative binds of repo
    # files become empty directories (container looped on exit 126). So the command is inlined here instead
    # (no `$` expansions on purpose: Coolify interpolates the compose at render time). The image's mise
    # home-tools step is skipped; those tools already live in the persistent home from earlier boots.
    entrypoint: ["/usr/bin/tini", "--", "/bin/bash", "-lc", "mkdir -p /home/opencode/.config/opencode /home/opencode/workspace && cd /home/opencode/workspace && exec opencode web --hostname 0.0.0.0 --port 4096 --print-logs --log-level INFO"]
    restart: unless-stopped
    cpus: ${OPENCODE_CPUS:-2}
    mem_limit: ${OPENCODE_MEM:-3g}
    ports:
      - "${BIND_IP:-127.0.0.1}:4096:4096"   # http://100.91.190.107:4096 — tailnet-only
    environment:
      OPENCODE_PORT: "4096"
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD in Coolify env}
      OPENCODE_INSTALL_HOME_TOOLS: "true"   # installs ~/.config/mise/config.toml tools 3 s after boot
      OPENCODE_PRINT_LOGS: "true"
      OPENCODE_LOG_LEVEL: INFO
      BROWSER: "true"                       # `opencode web` tries to open a browser; make that a no-op in the container
      TZ: America/Detroit
    volumes:
      - /data/probata/volumes/opencode/home:/home/opencode   # entire home persists (dotfiles, config, ~/workspace)
      # ONE VPS copy of skills/plugins (owner 2026-09-08 10:36): the devbox persist tree is the copy Syncthing keeps
      # in step with the desktop; the OpenCode server reads the same directories instead of a second mirror.
      - /data/probata/volumes/devbox/home/.claude/skills:/home/opencode/.claude/skills
      - /data/probata/volumes/devbox/home/.agents/skills:/home/opencode/.agents/skills
      - /data/probata/volumes/devbox/home/.claude/local-plugins:/home/opencode/.claude/local-plugins
      - /mnt/desktop-share:/home/opencode/desktop:rslave     # desktop the-platform-workspace over SMB (host automount)
    healthcheck:
      # 401 is the healthy answer when OPENCODE_SERVER_PASSWORD is set (curl -f would treat it as failure)
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4096/ | grep -Eq '^(200|401)$'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - probata
    labels:
      # ---- route prepared, NOT open (owner 17:26: "add the traefik labels … just don't open the route")
      - traefik.enable=false
      - traefik.docker.network=probata
      - traefik.http.routers.opencode-server.rule=Host(`opencode.int.mitechconsult.com`)
      - traefik.http.routers.opencode-server.entrypoints=https
      - traefik.http.routers.opencode-server.tls=true
      - traefik.http.routers.opencode-server.tls.certresolver=letsencrypt
      - traefik.http.routers.opencode-server.service=opencode-server
      - traefik.http.routers.opencode-server.middlewares=opencode-server-authentik
      - traefik.http.services.opencode-server.loadbalancer.server.port=4096
      - 'traefik.http.middlewares.opencode-server-authentik.forwardauth.address=http://authentik-server:9000/outpost.goauthentik.io/auth/traefik'
      - traefik.http.middlewares.opencode-server-authentik.forwardauth.trustForwardHeader=true
      - 'traefik.http.middlewares.opencode-server-authentik.forwardauth.authResponseHeaders=X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid,X-authentik-jwt,X-authentik-meta-jwks,X-authentik-meta-outpost,X-authentik-meta-provider,X-authentik-meta-app,X-authentik-meta-version'
      - coolify.traefik.middlewares=opencode-server-authentik

  # Tailnet hostname: served by the HOST's tailscaled as a Tailscale Service (`tailscale serve --service=svc:<name>`),
  # like svc:workbench / svc:llm-probe. The tailscale/tailscale sidecar + serve.json that lived here was RETIRED
  # 2026-09-08 13:45 (owner: use the feature, not a hand-rolled sidecar). See docs/planning/2026-09-08-TODO.md #18.

networks:
  probata:
    external: true
