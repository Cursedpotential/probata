# =============================================================================
# DATA TIER — CASE GRAPHITI (second Graphiti instance, CASE/AGENT memory lane).
#
# WHY A SECOND INSTANCE AND NOT JUST A group_id (owner ruling 2026-07-30/31):
# agent memory for evidence + legal reasoning must NOT share a memory space with
# platform build chatter — provenance, retrieval contamination, disclosure
# boundaries and retention lifecycles all differ. A Graphiti instance binds to
# exactly ONE Neo4j database, so `group_id` can only partition WITHIN one database
# and a stray clear_graph/DETACH DELETE crosses it freely. Cross-database
# separation therefore requires a separate instance. That database boundary is
# also the ONLY mechanical wall available: DozerDB's RBAC is unimplemented
# upstream (ADR-0036 Outcome), so role-scoped writers are not an option today.
#
# LANES:
#   data-graphiti      -> database `neo4j`   -> BUILD/DEV memory (owner + Claude)
#   data-graphiti-case -> database `memory`  -> CASE/AGENT memory  (this file)
#   Semantica          -> database `evidence` -> evidence graph (agents read-only)
#
# ---------------------------------------------------------------------------
# 2026-07-31 — TWO CHANGES, both load-bearing:
#
# 1. OUR OWN IMAGE (docker/graphiti-mcp/). The upstream zepai image DISCARDS the
#    configured Neo4j database for the neo4j provider, so this instance wrote its
#    episodes into the DEV database twice. Our build carries the two-hunk fix.
#    That image also bakes config.yaml, so the CONFIG_PATH bind-mount is GONE.
#
# 2. RELOCATED TO ovh-files. Measured 2026-07-31: ovh-data has ~3 GB RAM free
#    (Neo4j alone holds 1.1 GB) across Weaviate/Milvus/PG/Surreal; ovh-files was
#    upgraded to 8 cores / 22 GB / 158 GB. The image now carries torch (GLiNER2
#    CPU-local NER + the local BGE reranker), so it goes where the memory is.
#
# ⚠ CROSS-BOX GOTCHA: an `agno` docker network exists on ovh-files too, but it is
#    a SEPARATE BRIDGE from ovh-data's — same name, different network. Neo4j is
#    NOT reachable by docker DNS from here. NEO4J_URI must be the tailnet IP.
#    Pre-verified from ovh-files: bolt 100.119.96.29:7687 reachable, and Portkey
#    100.72.169.40:8787 reachable.
#
# DEPLOY AS ITS OWN Coolify "Docker Compose" app `data-graphiti-case` on
# ovh-files (server cn89l8801u8gsginw1rxq5qt), repo
# Cursedpotential/probata (formerly mcp-platform-agno-mvp) @ main, file /compose.data-graphiti-case.yaml.
# Env:
#   BIND_IP=100.91.190.107        (ovh-files tailnet — ports bind here, never 0.0.0.0)
#   NEO4J_URI=bolt://100.119.96.29:7687   (tailnet, NOT docker DNS — see above)
#   NEO4J_PASSWORD                (must match data-neo4j)
#   NEO4J_DATABASE=memory         (now actually honored, thanks to our patch)
#   GRAPHITI_GROUP_ID=case-salem-kinzel
#
# HOST-PREP (done 2026-07-31) — Coolify mounts these read-only, must pre-exist:
#   /data/agno/config/graphiti-case/{hostfix.conf,portkeyfix.conf}
#
# PORTS: 8073 (the dev instance owns 8071). Tailnet-only, never proxied publicly —
# external access goes through ContextForge (ADR-0025), never a direct Traefik route.
# =============================================================================

services:
  graphiti-case-mcp:
    image: ${GRAPHITI_MCP_IMAGE:-ghcr.io/cursedpotential/graphiti-mcp:0.29.3}
    platform: linux/amd64
    container_name: graphiti-case-mcp
    restart: unless-stopped
    # No host port — the hostfix sidecar owns ${BIND_IP}:8073.
    environment:
      # config.yaml is BAKED INTO THE IMAGE now (upstream ignores CONFIG_PATH,
      # which is why it used to be bind-mounted). Everything per-instance is env.
      BROWSER: "0"
      FASTMCP_TRANSPORT_SECURITY: '{"enable_dns_rebinding_protection": false}'
      # Tailnet, not docker DNS — ovh-files is a different box (see gotcha above).
      NEO4J_URI: ${NEO4J_URI:-bolt://100.119.96.29:7687}
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-graphiti-dev-password}
      # THE isolation control. Upstream silently dropped this; our patched image
      # passes it through as Neo4jDriver(database=...). Verified isolated: a node
      # written here is invisible from the `neo4j` database.
      NEO4J_DATABASE: ${NEO4J_DATABASE:-memory}
      # Logical partition WITHIN the `memory` database.
      GRAPHITI_GROUP_ID: ${GRAPHITI_GROUP_ID:-case-salem-kinzel}
      # LLM + embeddings via the portkeyfix sidecar -> Portkey on ovh-app
      # (ADR-0042; LiteLLM is retired). Dummy key: nginx injects the real
      # x-portkey-config server-side and never inspects this value.
      OPENAI_API_KEY: portkey-sidecar-noauth
      OPENAI_API_URL: http://graphiti-case-portkeyfix:8072/v1
      OPENAI_BASE_URL: http://graphiti-case-portkeyfix:8072/v1
    networks:
      - graphiti-case

  graphiti-case-hostfix:
    image: nginx:alpine
    container_name: graphiti-case-hostfix
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:8073:8073"   # tailnet-only; external access only via ContextForge
    volumes:
      - /data/agno/config/graphiti-case/hostfix.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - graphiti-case-mcp
    networks:
      - graphiti-case

  graphiti-case-portkeyfix:
    image: nginx:alpine
    container_name: graphiti-case-portkeyfix
    restart: unless-stopped
    volumes:
      - /data/agno/config/graphiti-case/portkeyfix.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - graphiti-case

networks:
  graphiti-case:

