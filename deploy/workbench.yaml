# Byline: Codex · GPT-5 · 2026-08-18 (owner-only native evidence search credential)
# Byline: Codex · GPT-5 · 2026-08-28 (unified proffer (then UIW) production surface)
# Byline: Codex · GPT-5 · 2026-08-29 (Authentik-only Traefik ingress boundary)
# Byline: Codex · GPT-5 · 2026-08-29 (private movable Tailscale Service ingress)
# Byline: Codex · GPT-5.6-Sol · 2026-08-29 (private Platform API service-DNS cutover)
# Byline: Codex · GPT-5.6-Sol · 2026-08-30 (runtime proffer (then UIW) service credential)
# =============================================================================
# KNOWLEDGE WORKBENCH — deploy as its OWN Coolify app on OVH-1 ("ovh-app",
# tailnet 100.72.169.40). Single-service app per the one-concern-per-app rule
# (see compose.data-vector.yaml for the pattern precedent).
#
# Coolify Watch Paths for this app: workbench/** + deploy/workbench.yaml
# Branch: workbench/sprint (sprint), main after milestone merges.
#
# HOST-PREP (once, before first deploy):
#   sudo mkdir -p /data/probata/volumes/workbench/{inbox,copilot}
#   sudo chown -R 1000:1000 /data/probata/volumes/workbench
#   sudo install -d -m 0700 /data/probata/secrets/platform
#   sudo install -m 0400 /dev/null /data/probata/secrets/platform/api-bearer
#   # Write the Platform API bearer without a trailing newline; never place it in env.
#   docker network inspect probata >/dev/null 2>&1 || docker network create probata
#
# C2.5 (Ops Copilot) points at the exec-gateway service. Authentication for
# user-facing Workbench traffic is owned by Authentik at Traefik; this manifest
# does not carry a shared-password ingress contract.
#
# The released intake path streams source bytes to the Universal Import
# starter's authenticated acquisition ingress and sends only its opaque
# reference through Temporal. The retired LanceDB intake store is not mounted
# or used by this deployment. PostgreSQL remains canonical.
#
# Case Bible Sorted is the fixed default ingestion source. Credentials are read
# at runtime from a mounted JSON document; the bucket is not filesystem-mounted.
#
# Coolify gotcha: env values are rendered as literals into the materialized
# compose at deploy — set ALL envs (bulk API, {"data":[...]} shape) BEFORE the
# first deploy; later env changes require a redeploy.
# =============================================================================
# Byline: Claude Code · Fable 5 · 2026-07-19 (MCP_SERVERS/CONTEXTFORGE_TOKEN added 2026-07-20, C1 rebuild; OPENCODE_*/COPILOT_PRESETS_PATH + copilot bind mount added 2026-07-21, C2.5; agno 2.8 MCP door migration (:8001->:8000 + token_env) + GRAPHITI_MCP_URL added 2026-07-23, Claude Code · Sonnet (agent), C4; Coolify path/watch-path true-up 2026-08-13, Codex · GPT-5; Graphiti host repoint + model-lab Portkey env + held neutral-chat config contract 2026-08-16, Codex · GPT-5)

services:
  workbench:
    build:
      context: ./modules/workbench
      dockerfile: Dockerfile
    image: probata-workbench:latest
    container_name: workbench
    restart: unless-stopped
    environment:
      APP_PORT: "8020"
      # Exact socket peer allowed to assert Authentik identity. Set this to the
      # Coolify Traefik address as a /32 (or /128), never a broad Docker/tailnet
      # range. Missing or malformed configuration fails closed.
      TRUSTED_AUTH_PROXY_CIDRS: ${TRAEFIK_PROXY_CIDR}  # Coolify renders a `:?` message as the literal VALUE (seen live 2026-09-07); empty still fails closed in auth.py
      # Feature-gated owner testing path. Traefik remains the trusted socket
      # peer and X-Real-IP must be inside this Tailscale range. Disable after
      # Authentik activation without changing application code.
      TAILNET_AUTH_BYPASS_ENABLED: ${WORKBENCH_TAILNET_AUTH_BYPASS_ENABLED:-false}
      TAILNET_AUTH_BYPASS_CIDRS: ${WORKBENCH_TAILNET_AUTH_BYPASS_CIDRS:-100.64.0.0/10}
      TRUSTED_TAILSCALE_SERVE_PROXY_CIDRS: ${WORKBENCH_TAILSCALE_SERVE_PROXY_CIDRS:-127.0.0.1/32,172.17.0.1/32}
      # Same-host service traffic stays on the shared private Coolify network.
      # PLATFORM_API_URL remains overridable for a future cross-host Tailscale
      # Service cutover without changing Workbench application code.
      PLATFORM_API_URL: ${PLATFORM_API_URL:-http://platform-api:8000}
      # The Platform API currently uses the backend runtime's native bearer contract. The secret is
      # read fresh from the read-only mount below for every upstream request;
      # only this non-secret path is configurable.
      PLATFORM_API_BEARER_SECRET_FILE: /run/secrets/platform-api-bearer
      # Direct-tailnet Proffer boundary on ovh-files.
      PROFFER_STARTER_URL: ${PROFFER_STARTER_URL:-http://100.91.190.107:8091}
      # Shared service credential for authenticated preview/start/context calls.
      # The value is runtime-read on every request so rotation needs no rebuild.
      PROFFER_SERVICE_TOKEN_FILE: /run/secrets/proffer-service-token
      # Distinct owner-only capability for bounded exploratory evidence search.
      # It is runtime-read from the mount below and never issued to agents.
      EVIDENCE_OPERATOR_BEARER_SECRET_FILE: /run/secrets/evidence-operator-security-key
      # --- MCP tool servers (Tool Explorer, C1 console) ---
      # Normal MCP traffic uses the Portkey-published ContextForge doors and
      # their own scoped credentials. The Platform API bearer is not an MCP
      # environment credential; native calls read it only from the file mount.
      # Set as a LITERAL, not `${MCP_SERVERS:-<json>}`: Docker Compose's
      # interpolation has no brace-nesting awareness, so a JSON default
      # containing `}` would truncate at the JSON's own first `}`. This is
      # also just this repo's existing Coolify convention anyway (env
      # values are rendered as literals at deploy — see the file header) —
      # to override, edit this value directly in the Coolify env editor.
      # Activation contains only Portkey-published ContextForge virtual-server
      # endpoints with gateway:"portkey" on every entry. The Platform API has
      # no MCP surface.
      # Empty is fail-closed. Direct doors require the explicit diagnostic flag.
      MCP_SERVERS: ${MCP_SERVERS:-[]}
      MCP_DIRECT_BYPASS_ALLOWED: ${MCP_DIRECT_BYPASS_ALLOWED:-false}
      CONTEXTFORGE_TOKEN: ${CONTEXTFORGE_TOKEN:-}
      # --- LLM gateway (default model-lab route) ---
      # Self-hosted Portkey accepts the selected upstream in
      # x-portkey-provider and the corresponding upstream credential as the
      # bearer token. The Workbench never exposes either value to the browser.
      # A future Portkey control-plane key can omit PORTKEY_PROVIDER and use
      # the same variables for the integrated cloud Model Catalog instead.
      PORTKEY_BASE_URL: ${PORTKEY_BASE_URL:-http://100.72.169.40:8787/v1}
      PORTKEY_PROVIDER: ${PORTKEY_PROVIDER:-}
      PORTKEY_API_KEY: ${PORTKEY_API_KEY:-}
      PORTKEY_MODEL_ID: ${PORTKEY_MODEL_ID:-gpt-4o}
      # Required by POST /v1/chat. The saved config owns fallback/load-balance
      # policy; empty fails closed. Provision only during the separately
      # approved Workbench activation.
      PORTKEY_CONFIG: ${PORTKEY_CONFIG:-}
      PORTKEY_ENVIRONMENT: ${PORTKEY_ENVIRONMENT:-production}
      # --- Graphiti knowledge-graph memory (C4 Graph memory pane) ---
      # Graphiti is retired for now (D-070). SurrealDB is the governed final
      # temporal-graph, walk, and analysis engine (D-073/D-080).
      # GRAPHITI_MCP_URL: ${GRAPHITI_MCP_URL:-}
      # --- Ops Copilot (C2.5) — headless OpenCode server, exec-gateway app ---
      OPENCODE_URL: ${OPENCODE_URL:-http://100.72.169.40:4096}
      OPENCODE_USERNAME: ${OPENCODE_USERNAME:-opencode}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-groq/llama-3.3-70b-versatile}
      OPENCODE_WORKSPACE_DIR: ${OPENCODE_WORKSPACE_DIR:-/workspace/copilot}
      COPILOT_PRESETS_PATH: ${COPILOT_PRESETS_PATH:-/data/copilot/presets.json}
      CASEBIBLE_R2_CONFIG_PATH: /run/secrets/casebible-r2.json
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
    volumes:
      # Bind mounts only — owner backs up host dirs (no named volumes).
      - /data/probata/volumes/workbench/inbox:/data/inbox
      # C2.5 Ops Copilot preset-prompt override (optional — see
      # app/service/copilot_presets.py; absent file = in-code defaults only).
      - /data/probata/volumes/workbench/copilot:/data/copilot
      # Runtime-read bearer rotation takes effect on the next request without
      # rebuilding, restarting, or redeploying Workbench.
      - /data/probata/secrets/platform/api-bearer:/run/secrets/platform-api-bearer:ro
      - /data/probata/secrets/platform/evidence-operator-security-key:/run/secrets/evidence-operator-security-key:ro
      - /data/probata/secrets/casebible-r2.json:/run/secrets/casebible-r2.json:ro
      - /data/probata/secrets/proffer/service-token:/run/secrets/proffer-service-token:ro
    ports:
      # Private door: Tailscale Serve owns the stable HTTPS identity and
      # proxies directly to this unique loopback-only host port. Public
      # traffic remains an independent Coolify Traefik route below.
      - "127.0.0.1:18080:8020"
    healthcheck:
      # /health deliberately stays HTTP 200 while degraded; require its JSON
      # contract so missing R2 access cannot be reported healthy by Docker.
      test: ["CMD-SHELL", "python3 -c \"import json,urllib.request,sys; body=json.load(urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=5)); sys.exit(0 if body.get('status') == 'ok' and body.get('object_store') is True else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - workbench
      - probata
    labels:
      - traefik.enable=true
      - traefik.docker.network=xjbuo6drbwjfby75lalk8bk7
      - traefik.http.routers.workbench.rule=Host(`workbench.int.mitechconsult.com`)
      - traefik.http.routers.workbench.entrypoints=https
      - traefik.http.routers.workbench.tls=true
      - traefik.http.routers.workbench.tls.certresolver=letsencrypt
      - traefik.http.routers.workbench.service=workbench
      - traefik.http.routers.workbench.middlewares=workbench-authentik
      - traefik.http.services.workbench.loadbalancer.server.port=8020
      - traefik.http.middlewares.workbench-authentik.forwardauth.address=http://authentik-server:9000/outpost.goauthentik.io/auth/traefik
      - traefik.http.middlewares.workbench-authentik.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.workbench-authentik.forwardauth.authResponseHeaders=X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid,X-authentik-jwt,X-authentik-meta-jwks,X-authentik-meta-outpost,X-authentik-meta-provider,X-authentik-meta-app,X-authentik-meta-version
      - coolify.traefik.middlewares=workbench-authentik

networks:
  workbench:
  probata:
    external: true   # shared cross-app net for Traefik, Authentik, and Workbench
