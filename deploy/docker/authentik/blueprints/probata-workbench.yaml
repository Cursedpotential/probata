# yaml-language-server: $schema=https://version-2026-8.goauthentik.io/blueprints/schema.json
version: 1

metadata:
  name: Probata - Workbench browser access
  labels:
    blueprints.goauthentik.io/instantiate: "true"
    blueprints.goauthentik.io/description: >-
      Single-application forward-auth contract for the public Probata
      Workbench. Tailscale access remains a separate private path.

entries:
  - model: authentik_providers_proxy.proxyprovider
    state: present
    id: probata-workbench-provider
    identifiers:
      name: Probata Workbench
    attrs:
      mode: forward_single
      external_host: https://workbench.int.mitechconsult.com
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      intercept_header_auth: true
      access_token_validity: hours=24
      refresh_token_validity: days=30
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-entitlements]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/proxy/scope-proxy]]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: probata-workbench
    attrs:
      name: Probata Workbench
      provider: !KeyOf probata-workbench-provider
      meta_launch_url: https://workbench.int.mitechconsult.com
      meta_description: Governed source intake and review
      meta_publisher: MiTech Consult
      policy_engine_mode: any

  - model: authentik_outposts.outpost
    state: present
    identifiers:
      name: authentik Embedded Outpost
    attrs:
      type: proxy
      providers:
        - !KeyOf probata-workbench-provider
