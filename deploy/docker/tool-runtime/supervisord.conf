[program:sbv]
command=/opt/sbv/sbv
directory=/opt/sbv
# Multi-stage COPY does not inherit the source image's DB_PATH_PREFIX. Pin it
# to the deployed bind mount so auth, per-user databases, and import artifacts
# survive container replacement. SBV listens on its default port 8085.
environment=LD_LIBRARY_PATH="/opt/sbv-libs",DB_PATH_PREFIX="/opt/sbv/data"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:tools-facade]
command=python -m uvicorn facade:app --host 0.0.0.0 --port 8090
directory=/opt/tools
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
