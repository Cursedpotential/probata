# =============================================================================
# Byline: Claude Code · Kimi K3 (drift-fix) · 2026-08-12 — LiteLLM labels
#         corrected (RETIRED per ADR-0042; nothing listens behind :4000).
# =============================================================================
# GATEWAY — ~~LiteLLM proxy (OpenAI-compatible)~~ + OpenCode server, split out of
# the exec-tier bundle (compose.exec.yaml), owner order 2026-07-19: "separate
# — Corrected 2026-08-12: LiteLLM is RETIRED (ADR-0042, owner 2026-07-29); the
# binary/config stay baked into the image but supervisord has autostart=false
# (docker/gateway/supervisord.conf), so NOTHING listens behind :4000 in this
# app. The live model gateway is PORTKEY — its own Coolify app
# (deploy/portkey.yaml). Original header continued:
# anything that can be separated." Mirrors the proven data-tier split (commit
# 18c42d2): one compose file per Coolify app.
#
# DEPLOY AS its own Coolify "Docker Compose" app on OVH-1 (server
# fmuao9enq3nxk8qw5hqjzzce), app `exec-gateway`. Build context is
# ./docker/gateway (bakes litellm-config.yaml at build time — set the
# Coolify app's base directory to repo root "/" so this path resolves).
# Env: BIND_IP=100.72.169.40 + provider keys (NVIDIA/OLLAMA/GROQ/OPENROUTER/
# GOOGLE) + LITELLM_MASTER_KEY, copied from the exec-tier bundle's env.
#
# NOTE 2026-07-19: Graphiti no longer depends on this gateway (cut over to
# Portkey earlier today, see docs/portkey cutover notes) — cutover risk here
# is low; nothing else in the exec-tier calls `gateway` by docker name today
# (cross-box callers already use the OVH1_HOST tailnet IP), so this app does
# NOT need the shared `probata` network.
#
# CUTOVER (doors policy): old bundle's gateway container stays up until this
# is deployed + verified (/health/liveliness 200 + one real completion),
# THEN the gateway: block (incl. its stray duplicate `gateway:` key — fixed
# here) is removed from compose.exec.yaml (batched into the final cutover
# commit). Reversible: revert compose.exec.yaml + delete the exec-gateway app.
#
# C2.5 (Ops Copilot) fixes, added 2026-07-21 — diagnosed live same day, see
# tool-skills/opencode-ops/references/known-issues.md items #1 and #2:
#
# 1. `oc run` / POST /session/{id}/message 500s (UnknownError, ENOENT deep in
#    SystemPrompt.environment) whenever `?directory=` names a path that
#    doesn't exist inside the container — opencode tries to read/stat it as
#    part of building the session's environment context. Fix: bind-mount a
#    real host directory to /workspace and always pass a directory UNDER it.
#    HOST-PREP (once, before first deploy of this fix):
#      sudo mkdir -p /data/probata/volumes/gateway-workdirs
#      sudo chown -R 1000:1000 /data/probata/volumes/gateway-workdirs
#    The workbench container CANNOT mkdir on this host itself, so per-session
#    subdirectories aren't viable without a second moving part (an exec-into-
#    container step or a shared filesystem write path neither side has).
#    CHOSEN: one SINGLE pre-created directory (/workspace/copilot) shared by
#    EVERY Ops Copilot session — isolation between concurrent copilot
#    conversations comes from opencode's own session model (each session id
#    is independent even when they share a directory), not from per-session
#    dirs. Documented in workbench/api/app/repo/opencode_client.py and
#    workbench/api/app/config/settings.py (OPENCODE_WORKSPACE_DIR).
#
# 2. GET /provider (and /config/providers) return every connected provider's
#    live API key in PLAINTEXT over an UNAUTHENTICATED tailnet endpoint.
#    Fix: `opencode serve` speaks HTTP Basic natively via these two env
#    names — set OPENCODE_SERVER_PASSWORD for real (Coolify env editor, not
#    committed here) to turn auth on; OPENCODE_SERVER_USERNAME defaults to
#    "opencode" and rarely needs changing. Deploy-order note: bump this
#    (redeploy exec-gateway) BEFORE or together with the workbench app so
#    OPENCODE_PASSWORD there is never sent against an unauthenticated
#    server (harmless either order — Basic auth on an unauthenticated
#    server is just ignored — but matching them avoids a confusing gap).
# =============================================================================

services:
  gateway:
    build:
      context: ./deploy/docker/gateway
    image: agno-gateway:latest
    container_name: gateway
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:4000:4000"   # ~~LiteLLM proxy (OpenAI-compatible)~~ Corrected
                                            # 2026-08-12: LiteLLM RETIRED (ADR-0042) — this port
                                            # is published but serves NOTHING until litellm is
                                            # deliberately re-enabled (supervisord autostart=true)
                                            # or removed for real. Portkey is the model gateway.
      - "${BIND_IP:-127.0.0.1}:4096:4096"   # OpenCode server
    environment:
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-changeme-dev-key}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # --- C2.5 fixes (see header comment above) ---
      # `opencode serve` reads these natively for HTTP Basic auth. Leaving
      # OPENCODE_SERVER_PASSWORD unset keeps the server unauthenticated
      # (today's state) — set it in the Coolify env editor to close the
      # key-leak; never commit the real value here.
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set}
    volumes:
      # Bind mount only (owner backs up host dirs, no named volumes) — see
      # fix #1 above. HOST-PREP required before first deploy of this change.
      - /data/probata/volumes/gateway-workdirs:/workspace
    networks:
      - default

# Byline: Claude Code · Sonnet (agent) · 2026-07-19 (split out of compose.exec.yaml, exec-tier split, owner order 2026-07-19; C2.5 workspace bind-mount + OPENCODE_SERVER_* Basic-auth fixes added 2026-07-21)
