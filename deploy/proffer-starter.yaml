# Proffer starter — separate Coolify application on ovh-files.
# Watch paths — see deploy/WATCH-PATHS.md for the exact value to paste into
# Coolify. As of the vendored-build repair (2026-09-02):
#   modules/engine/**, deploy/docker/proffer-starter/**,
#   deploy/proffer-starter.yaml
# The upload ingress and worker share this host-backed source-object root.
# Prepare it with ownership 10001:10001 and mode 0750 before deployment.
# Byline: Codex · GPT-5.6-Sol · 2026-08-30 (durable preview and source-context API)
# Byline: Codex · GPT-5.6-Terra · 2026-08-30 (rotatable n8n runtime-file auth)
# Byline: Claude Code · Sonnet 5 · 2026-09-02 (BUILD LANE D1: hermetic vendored
# build post-restructure — build context set to repo root so
# deploy/docker/proffer-starter/Dockerfile's `COPY modules/engine/`
# resolves; dockerfile path made explicit and repo-root-relative)

services:
  proffer-starter:
    build:
      context: .
      dockerfile: deploy/docker/proffer-starter/Dockerfile
    image: ${PROFFER_STARTER_IMAGE:-platform-proffer-starter:latest}
    restart: unless-stopped
    # Host networking preserves the actual Tailscale socket peer. Docker's
    # published-port DNAT rewrites it to a bridge address and defeats the
    # direct-peer authorization check.
    network_mode: host
    environment:
      PLATFORM_DATABASE_URL_FILE: /run/secrets/platform-database-url
      TEMPORAL_HOST_PORT: ${TEMPORAL_HOST_PORT:?set}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-proffer-v1}
      REFERENCE_STARTER_ADDR: 100.91.190.107:8091
      REFERENCE_STARTER_HEALTH_URL: http://100.91.190.107:8091/healthz
      SOURCE_OBJECT_DIR: /data/proffer/source-objects
      PROFFER_UPLOAD_MAX_BYTES: ${PROFFER_UPLOAD_MAX_BYTES:?set}
      N8N_PROFFER_BASE_URL: ${N8N_PROFFER_BASE_URL:?set}
      N8N_PROFFER_AUTH_HEADER: ${N8N_PROFFER_AUTH_HEADER:?set}
      N8N_PROFFER_AUTH_VALUE_FILE: /run/secrets/n8n-proffer-auth
      PROFFER_PREVIEW_CURSOR_KEY_FILE: /run/secrets/proffer-preview-cursor-key
      PROFFER_SERVICE_TOKEN_FILE: /run/secrets/proffer-service-token
    volumes:
      - /data/probata/volumes/proffer/source-objects:/data/proffer/source-objects
      - /data/probata/secrets/proffer/preview-cursor-key:/run/secrets/proffer-preview-cursor-key:ro
      - /data/probata/secrets/proffer/service-token:/run/secrets/proffer-service-token:ro
      - /data/probata/secrets/n8n/proffer-auth:/run/secrets/n8n-proffer-auth:ro
      - /data/probata/secrets/platform/database-url:/run/secrets/platform-database-url:ro
